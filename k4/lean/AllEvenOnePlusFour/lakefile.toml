name = "AllEvenOnePlusFour"
defaultTargets = ["Challenge", "AllEvenOnePlusFour", "AxiomsCheck"]
allowNonModules = true

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "fc4f59e577feb1a4956671bc04ac18aaaf8cd842"

# The challenge statement (Mathlib only; contains the one intended `sorry`).
[[lean_lib]]
name = "Challenge"
allowNonModules = true

# The kernel-checked reduction (no `sorry`).
[[lean_lib]]
name = "AllEvenOnePlusFour"
allowNonModules = true

# `#print axioms` for every main theorem.
[[lean_lib]]
name = "AxiomsCheck"
allowNonModules = true
